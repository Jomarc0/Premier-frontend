name: Premier Frontend CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-osv-audit:
    name: NPM OSV Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Audit locked npm package versions
        run: python3 tools/audit-npm.py --root . --output npm-osv-vulnerabilities.json

  web:
    name: ${{ matrix.app }} Web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, staff, users, driver, rfid]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Build
        run: npm run build

  users-mobile:
    name: Users Mobile Export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: users-mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: users-mobile/package-lock.json

      - name: Clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify vendored image-size parser patch
        run: node vendor/image-size/premier-regression.test.cjs

      - name: Export Android bundle
        run: npm run build
